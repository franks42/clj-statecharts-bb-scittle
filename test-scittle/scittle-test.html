<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>clj-statecharts Scittle Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
    ul { list-style: none; padding: 0; }
    li { padding: 4px 8px; margin: 2px 0; border-radius: 4px; font-family: monospace; }
    p strong { font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>clj-statecharts Scittle Test</h1>
  <p>Testing clj-statecharts loaded via Scittle (SCI in browser)</p>
  <div id="results">Loading Scittle and source files...</div>

  <!-- Scittle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/scittle@0.7.30/dist/scittle.js"></script>

  <!-- Source files in dependency order (absolute paths from server root) -->
  <script type="application/x-scittle" src="/src/statecharts/utils.cljc"></script>
  <script type="application/x-scittle" src="/src/statecharts/clock.cljc"></script>
  <script type="application/x-scittle" src="/src/statecharts/delayed.cljc"></script>
  <script type="application/x-scittle" src="/src/statecharts/impl.cljc"></script>
  <script type="application/x-scittle" src="/src/statecharts/store.cljc"></script>
  <script type="application/x-scittle" src="/src/statecharts/scheduler.cljc"></script>
  <script type="application/x-scittle" src="/src/statecharts/sim.cljc"></script>
  <script type="application/x-scittle" src="/src/statecharts/service.cljc"></script>
  <script type="application/x-scittle" src="/src/statecharts/core.cljc"></script>

  <!-- Test script -->
  <script type="application/x-scittle" src="/test-scittle/scittle-tests.cljs"></script>
</body>
</html>
