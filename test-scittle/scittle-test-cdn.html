<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>clj-statecharts Scittle CDN Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
    ul { list-style: none; padding: 0; }
    li { padding: 4px 8px; margin: 2px 0; border-radius: 4px; font-family: monospace; }
    p strong { font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>clj-statecharts Scittle CDN Test</h1>
  <p>Testing clj-statecharts loaded entirely from jsdelivr CDN</p>

  <!-- Scittle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/scittle@0.7.30/dist/scittle.js"></script>

  <!-- clj-statecharts bundle from CDN -->

          src="https://cdn.jsdelivr.net/gh/franks42/clj-statecharts-bb-scittle@v0.1.7-scittle/dist/statecharts-bundle.cljc"></script>

  <!-- Test script (local) -->
  <script type="application/x-scittle" src="/test-scittle/scittle-tests.cljs"></script>

</html>
